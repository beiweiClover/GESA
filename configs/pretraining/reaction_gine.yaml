model:
  hidden_dim: 256
  num_layers: 5
  dropout: 0.1
  projection_dim: 128
  temperature: 0.1
  reactant_pool: atom_mean
optimizer: AdamW
batch_size: 256
seed: 42
epochs: 30
selected_epoch: 23
initial_learning_rate: 0.0005
minimum_learning_rate: 1.0e-05
schedule: 'epochs 1-10: 5% step warmup then cosine decay to 1e-5; epochs 11-30: continuation
  at 1e-5'
weight_decay: 1.0e-05
gradient_clip_norm: 5.0
amp: true
InfoNCE_temperature: 0.1
loss: 0.5*L_atom + 0.5*L_bond + 0.5*L_symmetric_InfoNCE
reaction_center_positive_weight: 'separately per atom/bond minibatch: clamp(N_negative/N_positive,
  1, 20); unweighted BCE if no positives'
loss_reduction: mean
selection: minimum total ORD validation loss, verified at epoch 23
split_counts:
  train: 828786
  valid: 6129
  test: 6352
split_membership: the exact 36 JSONL.gz shards and split field distributed in Zenodo
  ord/
split_policy: retained upstream scaffold split during cleaning; no exact canonical
  product across splits; no new random split at pretraining time
test_used_for_training_or_selection: false
